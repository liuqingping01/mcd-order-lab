<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>麦麦点单决策台 · mcd-order-lab</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">M</span>
      <div>
        <h1>麦麦点单决策台</h1>
        <p class="brand-sub">基于麦当劳 MCP 实时数据的多目标点单决策工具</p>
      </div>
    </div>
    <div class="status" id="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">正在检测 MCP 连接…</span>
    </div>
  </div>
</header>

<main class="layout">

  <!-- 参数面板 -->
  <aside class="panel">
    <h2 class="panel-title">决策条件</h2>

    <div class="field-row">
      <label class="field">
        <span class="field-label">城市</span>
        <input id="city" type="text" placeholder="杭州" value="杭州" />
      </label>
      <label class="field">
        <span class="field-label">位置关键词</span>
        <input id="keyword" type="text" placeholder="文三路" value="文三路" />
      </label>
    </div>
    <span class="field-hint" style="margin:-8px 0 12px">用于查询附近的到店自取门店</span>

    <div class="field-row">
      <label class="field">
        <span class="field-label">人数</span>
        <input id="people" type="number" min="1" max="20" value="2" />
      </label>
      <label class="field">
        <span class="field-label">总预算（元）</span>
        <input id="budget" type="number" min="1" step="1" value="80" />
      </label>
    </div>

    <div class="field-row">
      <label class="field">
        <span class="field-label">人均热量上限</span>
        <input id="maxKcal" type="number" min="0" step="50" value="800" />
        <span class="field-hint">千卡，0 = 不限</span>
      </label>
      <label class="field">
        <span class="field-label">人均蛋白质下限</span>
        <input id="minProtein" type="number" min="0" step="1" value="0" />
        <span class="field-hint">克，0 = 不限</span>
      </label>
    </div>

    <label class="field">
      <span class="field-label">忌口关键词</span>
      <input id="avoid" type="text" placeholder="逗号分隔，例如：辣, 牛肉" />
    </label>

    <label class="field">
      <span class="field-label">偏好关键词</span>
      <input id="prefer" type="text" placeholder="逗号分隔，例如：鸡腿, 咖啡" />
    </label>

    <button id="runBtn" class="btn-primary">生成点单方案</button>

    <div class="note">
      <strong>说明</strong>
      <p>本工具只生成方案，<b>不会自动下单</b>。最终价格以麦当劳官方
      <code>calculate-price</code> 计算结果为唯一准绳。</p>
    </div>
  </aside>

  <!-- 结果区 -->
  <section class="results">
    <div id="warnings" class="warnings" hidden></div>

    <div id="meta" class="meta" hidden></div>

    <div id="empty" class="empty">
      <div class="empty-icon">🍔</div>
      <h3>填写左侧条件，开始决策</h3>
      <p>系统会调用麦当劳 MCP 实时菜单、营养与优惠券数据，给出 3~5 个可比对的方案。</p>
    </div>

    <div id="schemes" class="schemes"></div>
  </section>

</main>

<footer class="footer">
  <span>mcd-order-lab · 1024程序员节 麦当劳程序员创意开发大赛参赛作品</span>
  <span class="footer-dim">餐品信息、价格及供应状态以麦当劳官方渠道实时结果为准</span>
</footer>

<script src="./app.js"></script>
</body>
</html>
