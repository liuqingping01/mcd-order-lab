<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>麦麦怎么买最划算 · mcd-order-lab</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">M</span>
      <div>
        <h1>麦麦怎么买最划算</h1>
        <p class="brand-sub">买套餐还是单点？用麦当劳官方数据算给你看</p>
      </div>
    </div>
    <div class="status" id="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">正在检测 MCP 连接…</span>
    </div>
  </div>
</header>

<main class="layout-deal">

  <!-- 输入 -->
  <section class="askcard">
    <label class="ask-label" for="want">你想吃哪个？</label>
    <input id="want" class="ask-input" type="text" placeholder="板烧鸡腿堡" value="板烧鸡腿堡" />
    <div class="field-row ask-row">
      <div>
        <span class="field-label">城市</span>
        <input id="city" type="text" placeholder="杭州" value="杭州" />
      </div>
      <div>
        <span class="field-label">位置关键词</span>
        <input id="keyword" type="text" placeholder="文三路" value="文三路" />
      </div>
    </div>
    <button id="runBtn" class="btn-primary">算一下怎么买划算</button>
    <p class="ask-hint">价格全部取自麦当劳官方算价接口，不估算、不凑数</p>
  </section>

  <!-- 结果 -->
  <section class="results">
    <div id="warnings" class="warnings" hidden></div>

    <div id="empty" class="empty">
      <div class="empty-icon">🍔</div>
      <h3>输入你想吃的东西</h3>
      <p>系统会扫描门店全部套餐，找出包含它的那些，用官方价格逐条对比，告诉你多花多少钱、多得什么、划不划算。</p>
    </div>

    <div id="deal"></div>
  </section>

</main>

<footer class="footer">
  <span>mcd-order-lab · 1024程序员节 麦当劳程序员创意开发大赛参赛作品</span>
  <span class="footer-dim">餐品信息、价格及供应状态以麦当劳官方渠道实时结果为准</span>
</footer>

<script src="./app.js"></script>
</body>
</html>
